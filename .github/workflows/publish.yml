name: Publish npm package

on:
  push:
    tags:
      - 'dsh-context-rollover-v*'
      - 'dsh-client-continue-v*'
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (version must already be committed)
        type: choice
        required: true
        options:
          - '@chlrc/dsh-context-rollover'
          - '@chlrc/dsh-client-continue'
      version:
        description: Exact package.json version to publish
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'KiritoKing/dsh-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out triggered revision without publishing permission
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release tag, manifest and default-branch ancestry
        id: release
        run: node scripts/prepare-release.mjs

  publish:
    needs: prepare
    # The read-only preparation job must accept the revision before this job requests OIDC.
    runs-on: ubuntu-latest
    concurrency:
      group: publish-npm-${{ needs.prepare.outputs.package }}
      cancel-in-progress: false
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: plugins
    env:
      DSH_CHECKOUT_DIR: ${{ github.workspace }}/dsh-public-rc2
    steps:
      - name: Check out reviewed plugin revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: plugins
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Check out exact public DSH baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 639ed015397290b3745d163aafe02ffee4aa3f84
          path: dsh-public-rc2
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use OIDC-capable npm CLI
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Install public baseline without lifecycle scripts
        working-directory: dsh-public-rc2
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build host libraries and generated remote declarations
        working-directory: dsh-public-rc2
        run: pnpm run build:lib:host
      - name: Build client type declarations
        working-directory: dsh-public-rc2
        run: pnpm exec tsc -b tsconfig.client.json
      - name: Install plugin workspace without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate version and inspect release archives
        id: release
        env:
          RELEASE_PACKAGE: ${{ needs.prepare.outputs.package }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/check-public.mjs --release "$RELEASE_PACKAGE" "$RELEASE_VERSION"
      - name: Publish the inspected archive with npm Trusted Publishing
        env:
          RELEASE_TARBALL: ${{ steps.release.outputs.tarball }}
          RELEASE_DIST_TAG: ${{ needs.prepare.outputs.dist-tag }}
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          test -n "$RELEASE_TARBALL"
          npm publish "$RELEASE_TARBALL" --access public --provenance --ignore-scripts --tag "$RELEASE_DIST_TAG"
